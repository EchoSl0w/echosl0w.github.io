<div class="pwn-activity">
  <div class="pwn-card">
    <div class="pwn-header">
      <span class="pwn-title">Hacking Activity</span>
    </div>

    <div class="pwn-belt">
      <img
        src="https://pwn.college/belt/{{ site.data.pwn_activity.belt }}.svg"
        alt="{{ site.data.pwn_activity.belt | capitalize }} belt"
        width="48"
        height="48"
      />
      <div>
        <strong>{{ site.data.pwn_activity.belt | capitalize }} belt</strong><br />
        {{ site.data.pwn_activity.total_solves }} solves ·
        <span id="pwn-updated" data-updated="{{ site.data.pwn_activity.fetched_at }}"></span>
      </div>
    </div>

    <div class="pwn-months-wrap">
      <div id="pwn-months" class="pwn-months"></div>
      <div id="pwn-grid" class="pwn-grid" role="img" aria-label="Daily solves for this year"></div>
    </div>

    <div class="pwn-legend">
      <span>Less</span>
      <div class="sq c0"></div>
      <div class="sq c1"></div>
      <div class="sq c2"></div>
      <div class="sq c3"></div>
      <div class="sq c4"></div>
      <span>More</span>
    </div>
  </div>
</div>

<style>
  .pwn-card {
    background: #000;
    border: 1px solid #a3e635;
    border-radius: 6px;
    padding: 14px 16px;
    max-width: 100%;
    box-sizing: border-box;
    color: #d4d4d4;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px;
  }
  .pwn-header {
    margin-bottom: 12px;
  }
  .pwn-title {
    color: #a3e635;
    font-size: 14px;
  }
  .pwn-belt {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }
  .pwn-belt img {
    width: 48px; /* adjust this to change the SVG size */
    height: auto;
  }
  .pwn-months-wrap {
    width: 100%;
  }
  .pwn-months {
    position: relative;
    height: 16px;
    font-size: 12px;
    color: #d4d4d4;
  }
  .pwn-months span {
    position: absolute;
    top: 0;
    white-space: nowrap;
  }
  /* Cells scale to the card width; each stays square */
  .pwn-grid {
    display: grid;
    grid-auto-flow: column;
    grid-template-rows: repeat(7, auto);
    grid-auto-columns: minmax(0, 1fr);
    gap: 3px;
    width: 100%;
  }
  .pwn-grid > div {
    aspect-ratio: 1 / 1;
    border-radius: 2px;
  }
  .pwn-grid > .hidden {
    background: transparent;
  }
  .pwn-legend {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 10px;
    font-size: 12px;
    color: #d4d4d4;
  }
  .pwn-legend span {
    margin: 0 4px;
  }
  .sq {
    width: 12px;
    height: 12px;
    border-radius: 2px;
  }
  .c0 {
    background: #1c1c1c;
  }
  .c1 {
    background: #2f4a12;
  }
  .c2 {
    background: #4f7d1c;
  }
  .c3 {
    background: #7cb82c;
  }
  .c4 {
    background: #a3e635;
  }
</style>

<script>
  (function () {
    const days = {{ site.data.pwn_activity.days | jsonify }};
    const grid = document.getElementById('pwn-grid');
    const monthsEl = document.getElementById('pwn-months');
    if (!grid) return;

    const colors = ['#1c1c1c', '#2f4a12', '#4f7d1c', '#7cb82c', '#a3e635'];
    const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                        'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const DAY_MS = 86400000;

    const key = (d) => d.toLocaleDateString('en-CA', { timeZone: 'Europe/Berlin' });

    // Range: January 1 to December 31 of the current year.
    // The grid starts on the Sunday on or before January 1.
    const now = new Date();
    const year = now.getFullYear();
    const today = new Date(year, now.getMonth(), now.getDate());
    const jan1 = new Date(year, 0, 1);
    const start = new Date(year, 0, 1 - jan1.getDay());
    const dec31 = new Date(year, 11, 31);
    const totalDays = Math.round((dec31 - start) / DAY_MS) + 1;
    const weeks = Math.ceil(totalDays / 7);

    // Month labels, positioned as a share of the width (column pitch is (100% + 3px) / weeks)
    if (monthsEl) {
      for (let m = 0; m < 12; m++) {
        const first = new Date(year, m, 1);
        if (first > today) break;
        const col = Math.floor(Math.round((first - start) / DAY_MS) / 7);
        const label = document.createElement('span');
        label.textContent = monthNames[m];
        label.style.left = `calc((100% + 3px) * ${col} / ${weeks})`;
        monthsEl.appendChild(label);
      }
    }

    // Cells, filled column by column (one column per week)
    for (let w = 0; w < weeks; w++) {
      for (let r = 0; r < 7; r++) {
        const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + w * 7 + r);
        const cell = document.createElement('div');

        // Hide days outside this year and days that haven't happened yet
        if (d.getFullYear() !== year || d > today) {
          cell.className = 'hidden';
        } else {
          const k = key(d);
          const n = days[k] || 0;
          const level = n === 0 ? 0 : n <= 2 ? 1 : n <= 5 ? 2 : n <= 9 ? 3 : 4;
          cell.style.background = colors[level];
          cell.title = k + ': ' + n + (n === 1 ? ' solve' : ' solves');
        }
        grid.appendChild(cell);
      }
    }

    // "Last updated x ago"
    const el = document.getElementById('pwn-updated');
    if (!el) return;
    const updated = new Date(el.dataset.updated);
    const rtf = new Intl.RelativeTimeFormat('en', { numeric: 'auto' });
    const units = [['year', 31536000], ['month', 2592000], ['week', 604800],
                   ['day', 86400], ['hour', 3600], ['minute', 60]];
    function render() {
      const s = (Date.now() - updated.getTime()) / 1000;
      let text = 'Last updated just now';
      for (const [u, n] of units) {
        if (Math.abs(s) >= n) { text = 'Last updated ' + rtf.format(-Math.round(s / n), u); break; }
      }
      el.textContent = text;
    }
    render();
    setInterval(render, 60000);
  })();
</script>
